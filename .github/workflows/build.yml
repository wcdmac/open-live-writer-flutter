name: Build & Release

on:
  push:
    branches: [main, 'tmp/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: stable

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis + unit/widget tests
  # ---------------------------------------------------------------------------
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  # ---------------------------------------------------------------------------
  # Android (APK + AAB)
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      # P2-11: cache the Gradle distribution + dependency cache so Android
      # builds don't re-resolve every dependency on each run.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Rename artifacts
        run: |
          cd build/app/outputs
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          cp flutter-apk/app-*-release.apk "${GITHUB_WORKSPACE}/dist/"
          cp bundle/release/*.aab "${GITHUB_WORKSPACE}/dist/"
          ls -la "${GITHUB_WORKSPACE}/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: open-live-writer-android
          path: dist/*

  # ---------------------------------------------------------------------------
  # iOS — intentionally UNSIGNED (flutter build ios --no-codesign).
  # No code-signing step runs here on purpose: the artifact is an unsigned
  # IPA for sideloading or local re-signing, never App Store distribution.
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: analyze-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          # flutter build ios --no-codesign outputs build/ios/iphoneos/Runner.app
          # with NO embedded code signature, so it can only be sideloaded or
          # re-signed locally — never distributed through the App Store.
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry open-live-writer-ios-unsigned.ipa Payload
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          cp open-live-writer-ios-unsigned.ipa "${GITHUB_WORKSPACE}/dist/"

      - name: Verify IPA is unsigned
        run: |
          if [ -f Payload/Runner.app/embedded.mobileprovision ]; then
            echo "::error::Build unexpectedly embeds a provisioning profile (signed)."
            exit 1
          fi
          # An unsigned build has no code signature; codesign -dv must fail.
          if codesign -dv --verbose=2 Payload/Runner.app >/dev/null 2>&1; then
            echo "::error::Build is code-signed; expected an unsigned IPA (--no-codesign)."
            exit 1
          fi
          echo "OK: IPA is unsigned (no provisioning profile, no code signature)."

      - uses: actions/upload-artifact@v4
        with:
          name: open-live-writer-ios
          path: dist/*

  # ---------------------------------------------------------------------------
  # Windows (portable ZIP)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: analyze-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build Windows
        run: flutter build windows --release

      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/open-live-writer-windows-x64.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: open-live-writer-windows
          path: dist/*

  # ---------------------------------------------------------------------------
  # Linux (tar.gz)
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build Linux
        run: flutter build linux --release

      - name: Package tar.gz
        run: |
          mkdir -p dist
          tar -czf dist/open-live-writer-linux-x64.tar.gz \
            -C build/linux/x64/release/bundle .
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: open-live-writer-linux
          path: dist/*

  # ---------------------------------------------------------------------------
  # macOS (zip of .app)
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: analyze-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build macOS
        run: flutter build macos --release

      - name: Package ZIP
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/open_live_writer.app" \
            "dist/open-live-writer-macos.zip"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: open-live-writer-macos
          path: dist/*

  # ---------------------------------------------------------------------------
  # Release: publish all build artifacts to GitHub Releases (on v* tags)
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-android
      - build-ios
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
